name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'modules/**'
      - 'profiles/**'
      - 'guides/**'
      - 'scripts/generate_module_catalog.py'
      - 'scripts/generate_command_catalog.py'
      - 'site/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'modules/**'
      - 'mkdocs.yml'
      - 'scripts/generate_module_catalog.py'
      - 'scripts/generate_command_catalog.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[docs]"
      # The module catalog page is generated from the registry, so it can never
      # drift from what the tool actually ships.
      - name: Generate the module catalog
        run: |
          python scripts/generate_module_catalog.py --check
          python scripts/generate_command_catalog.py --check
      - name: Build (warnings are errors — a dead link is a broken doc)
        run: mkdocs build --strict
      # The landing page in `site/` is the root of the Pages site and the
      # MkDocs build sits under /docs/ (mkdocs.yml `site_url` agrees).
      - name: Assemble landing page + docs
        run: |
          mkdir -p _pages
          cp -R site/. _pages/
          rm -f _pages/Dockerfile
          cp -R site_build _pages/docs
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _pages

  deploy:
    name: deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
