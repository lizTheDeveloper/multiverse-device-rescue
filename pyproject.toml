[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multiverse-device-rescue"
version = "0.1.0"
description = "Modern system diagnostic, repair, and maintenance toolkit"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.0",
    "textual>=8,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pyinstaller>=6.0"]
ai = ["anthropic>=0.40", "openai>=1.50", "httpx>=0.27"]
# The documentation site (mkdocs.yml + docs/). `mkdocs build --strict` needs
# both of these; pymdown-extensions arrives as a mkdocs-material dependency but
# is pinned explicitly because mkdocs.yml configures its extensions directly.
# Upper-bounded on purpose: mkdocs-material prints a startup notice that
# MkDocs 2.0 removes the plugin system with no migration path, so an unpinned
# `mkdocs` would break this build the day 2.0 lands on PyPI — in CI, on a
# change that had nothing to do with the docs.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "pymdown-extensions>=10.0"]

[project.scripts]
rescue = "rescue.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["rescue*"]

[tool.setuptools.package-data]
rescue = ["security/*.json", "tui/*.tcss"]
