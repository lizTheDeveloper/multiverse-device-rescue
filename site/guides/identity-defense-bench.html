<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🔐%3C/text%3E%3C/svg%3E">
<title>Identity Defense Bench</title>

<style>
.page-wrapper { max-width: none !important; padding: 0 !important; margin: 0 !important; }
.page-wrapper > h1 { display: none !important; }

:root {
  --bg: #0a0e17; --bg2: #0e1219; --panel: #111827; --panel2: #161e2e;
  --line: #1e293b; --line2: #2d3748;
  --ink: #e2e8f0; --mut: #94a3b8; --dim: #64748b;
  --amber: #f59e0b; --amber-ink: #fbbf24; --amber-bg: #1c1508;
  --red: #ef4444; --red-bg: #1f1012;
  --green: #22c55e; --green-bg: #0d1f12;
  --blue: #5b8def; --blue-bg: #0d1528;
  --r: 10px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f1f5f9; --bg2: #f8fafc; --panel: #ffffff; --panel2: #f1f5f9;
    --line: #cbd5e1; --line2: #e2e8f0;
    --ink: #0f172a; --mut: #475569; --dim: #94a3b8;
    --amber: #d97706; --amber-ink: #92400e; --amber-bg: #fef3c7;
    --red: #dc2626; --red-bg: #fef2f2;
    --green: #16a34a; --green-bg: #f0fdf4;
    --blue: #2563eb; --blue-bg: #dbeafe;
  }
}
:root[data-theme="light"], :root[data-theme="default"], :root[data-theme="original"] {
  --bg: #f1f5f9; --bg2: #f8fafc; --panel: #ffffff; --panel2: #f1f5f9;
  --line: #cbd5e1; --line2: #e2e8f0;
  --ink: #0f172a; --mut: #475569; --dim: #94a3b8;
  --amber: #d97706; --amber-ink: #92400e; --amber-bg: #fef3c7;
  --red: #dc2626; --red-bg: #fef2f2;
  --green: #16a34a; --green-bg: #f0fdf4;
  --blue: #2563eb; --blue-bg: #dbeafe;
}

*, *::before, *::after { box-sizing: border-box; }
html body .idb { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
.idb a { color: var(--blue); text-decoration: none; }
.idb a:hover { text-decoration: underline; }
.idb code { font-family: var(--mono); font-size: 0.86em; background: var(--bg2); border: 1px solid var(--line2); border-radius: 3px; padding: 1px 5px; }

.idb .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
@media (max-width: 860px) { .idb .app { grid-template-columns: 1fr; } }

.idb .rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--bg2); border-right: 1px solid var(--line); padding: 22px 16px; display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 860px) { .idb .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 14px; gap: 8px; } }
.idb .brand { padding: 8px 10px 18px; }
.idb .brand h1 { font-family: var(--mono); font-size: 17px; line-height: 1.15; letter-spacing: 0.02em; }
.idb .brand .sub { color: var(--mut); font-size: 12px; margin-top: 6px; line-height: 1.5; }
.idb .nav { display: flex; flex-direction: column; gap: 3px; }
@media (max-width: 860px) { .idb .nav { flex-direction: row; flex-wrap: wrap; } .idb .brand { width: 100%; padding-bottom: 10px; } }
.idb .navitem { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 9px; border: 1px solid transparent; color: var(--mut); background: none; text-align: left; width: 100%; cursor: pointer; font: inherit; font-size: 13px; transition: .15s; }
.idb .navitem:hover { background: var(--panel); color: var(--ink); }
.idb .navitem.active { background: var(--panel2); border-color: var(--line2); color: var(--ink); }
.idb .navitem .ico { width: 26px; height: 26px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 7px; background: var(--panel); font-size: 13px; }
.idb .navitem .tick { margin-left: auto; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line2); display: grid; place-items: center; font-size: 10px; color: transparent; flex: 0 0 auto; }
.idb .navitem.done .tick { background: var(--green); border-color: var(--green); color: #fff; }
.idb .rail-foot { margin-top: auto; padding: 12px 8px 4px; font-size: 11px; color: var(--dim); line-height: 1.5; }
@media (max-width: 860px) { .idb .rail-foot { width: 100%; margin-top: 0; } }
.idb .minibtn { font-size: 12px; color: var(--mut); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; font: inherit; font-size: 12px; margin-top: 8px; display: block; width: 100%; text-align: left; }
.idb .minibtn:hover { color: var(--ink); border-color: var(--line2); }

.idb .main { padding: 36px 44px 80px; max-width: 920px; margin: 0 auto; width: 100%; }
@media (max-width: 860px) { .idb .main { padding: 24px 18px 60px; } }
.idb .station { animation: rise .25s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }
@keyframes confetti-fall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
.idb .eyebrow { font-family: var(--mono); text-transform: uppercase; letter-spacing: .16em; font-size: 11px; color: var(--amber); margin-bottom: 6px; }
.idb .stn-title { font-family: var(--mono); font-size: 26px; line-height: 1.12; margin: 0 0 6px; letter-spacing: 0.01em; }
.idb .stn-lede { color: var(--mut); font-size: 15px; max-width: 68ch; margin-bottom: 22px; }
.idb .stn-lede b { color: var(--ink); }

.idb .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; margin: 14px 0; }
.idb .card.accent { border-left: 3px solid var(--amber); }
.idb .card.red { border-left: 3px solid var(--red); }
.idb .card.green { border-left: 3px solid var(--green); }
.idb .card.blue { border-left: 3px solid var(--blue); }
.idb .card h3 { font-family: var(--mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 4px; }
.idb .card .hint { color: var(--mut); font-size: 13px; margin-bottom: 12px; }
.idb .field { display: flex; flex-direction: column; gap: 5px; margin: 12px 0; }
.idb .field-label { font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.idb .field-hint { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--mut); font-size: 12px; }
.idb input[type="text"], .idb textarea, .idb select { background: var(--bg2); border: 1px solid var(--line2); border-radius: 8px; color: var(--ink); font: inherit; font-size: 14px; padding: 10px 12px; width: 100%; resize: vertical; }
.idb input:focus, .idb textarea:focus, .idb select:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,158,11,.15); }
.idb .radio-group { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0; }
.idb .radio-group label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line2); border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--mut); transition: .15s; }
.idb .radio-group label:hover { border-color: var(--amber); color: var(--ink); }
.idb .radio-group input:checked + span { color: var(--amber-ink); }
.idb .radio-group input { accent-color: var(--amber); }
.idb .checklist { margin: 6px 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.idb .checklist li { margin: 0; }
.idb .checklist li::before { content: none; }
.idb .checklist label { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 14px; }
.idb .checklist label:hover { background: var(--panel2); }
.idb .checklist input { margin-top: 3px; accent-color: var(--green); flex: 0 0 auto; }
.idb .scorecard { background: var(--amber-bg); border: 1px solid var(--amber); border-radius: var(--r); padding: 18px 20px; margin: 20px 0; }
.idb .scorecard h3 { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--amber-ink); margin: 0 0 8px; }
.idb .scorecard .req { font-size: 14px; color: var(--ink); margin: 0 0 4px; }
.idb .scorecard .status { font-family: var(--mono); font-size: 12px; margin-top: 8px; }
.idb .scorecard .status.pass { color: var(--green); }
.idb .scorecard .status.incomplete { color: var(--dim); }
.idb .alert { background: var(--red-bg); border: 1px solid var(--red); border-radius: var(--r); padding: 14px 18px; margin: 16px 0; font-size: 14px; }
.idb .alert b { color: var(--red); }
.idb .msg-envelope { background: var(--bg2); border: 1px solid var(--line2); border-radius: var(--r); padding: 16px 20px; margin: 10px 0; font-size: 14px; }
.idb .msg-type { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); margin-bottom: 6px; }
.idb .msg-from { font-weight: 700; margin-bottom: 2px; }
.idb .msg-subject { color: var(--mut); font-size: 13px; margin-bottom: 8px; font-style: italic; }
.idb .msg-body { line-height: 1.6; }
.idb .reveal { margin-top: 12px; padding: 12px 16px; border-radius: 8px; font-size: 13px; display: none; }
.idb .reveal.shown { display: block; }
.idb .reveal.correct { background: var(--green-bg); border: 1px solid var(--green); }
.idb .reveal.wrong { background: var(--red-bg); border: 1px solid var(--red); }
.idb .reveal-btn { font: inherit; font-size: 12px; font-family: var(--mono); letter-spacing: .05em; padding: 6px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--mut); border-radius: 7px; cursor: pointer; margin-top: 8px; }
.idb .reveal-btn:hover { border-color: var(--amber); color: var(--amber); }
.idb .cat-header { display: flex; align-items: center; gap: 10px; margin: 20px 0 8px; }
.idb .cat-header .cat-icon { font-size: 20px; }
.idb .cat-header h3 { font-family: var(--mono); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; margin: 0; }
.idb .cat-header .risk { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; margin-left: auto; }
.idb .cat-header .risk-high { background: var(--red-bg); color: var(--red); }
.idb .cat-header .risk-medium { background: var(--amber-bg); color: var(--amber); }
.idb .cat-header .risk-low { background: var(--panel2); color: var(--dim); }
.idb .cat-why { color: var(--mut); font-size: 13px; margin: 0 0 8px; padding-left: 30px; }
.idb .acct-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 30px; font-size: 14px; }
.idb .acct-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1; }
.idb .acct-row input { accent-color: var(--amber); flex: 0 0 auto; }
.idb .acct-row .money { font-family: var(--mono); font-size: 10px; color: var(--amber); letter-spacing: .08em; text-transform: uppercase; }
.idb .row { display: flex; gap: 12px; flex-wrap: wrap; }
.idb .row > * { flex: 1 1 180px; }

@media (prefers-reduced-motion: reduce) {
  .idb *, .idb *::before, .idb *::after { animation: none !important; transition: none !important; }
}
@media print {
  .idb .rail { display: none !important; }
  .idb .app { grid-template-columns: 1fr !important; }
  .idb .main { padding: 20px !important; max-width: none !important; }
  .idb { background: #fff !important; color: #000 !important; }
  .idb .card, .idb .scorecard { border-color: #ccc !important; background: #fff !important; }
}
</style>

<div class="idb">
<div class="app">
<nav class="rail">
  <div class="brand">
    <h1>Identity Defense Bench</h1>
    <div class="sub">Your accounts. Your passwords. Tonight.</div>
  </div>
  <div class="nav" id="nav"></div>
  <div class="rail-foot">
    <span>Everything stays in your browser. Nothing is sent anywhere.</span>
    <button class="minibtn" id="clear-all" type="button">Clear all my work</button>
    <button class="minibtn" id="print-btn" type="button">Print recovery audit</button>
  </div>
</nav>
<div class="main">
  <div id="station"></div>
</div>
</div>
</div>

<script>
(function () {
"use strict";

function confetti() {
  var colors = ["#f59e0b","#22c55e","#5b8def","#ef4444","#a855f7","#ec4899"];
  var container = document.createElement("div");
  container.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:hidden";
  document.body.appendChild(container);
  for (var i = 0; i < 60; i++) {
    var p = document.createElement("div");
    var size = 6 + Math.random() * 6;
    p.style.cssText = "position:absolute;width:" + size + "px;height:" + size + "px;background:" + colors[i%colors.length]
      + ";border-radius:" + (Math.random()>0.5?"50%":"2px") + ";top:-10px;left:" + (Math.random()*100) + "%;opacity:1";
    p.style.animation = "confetti-fall " + (1.5+Math.random()*2) + "s ease-out forwards";
    p.style.animationDelay = (Math.random()*0.5) + "s";
    container.appendChild(p);
  }
  setTimeout(function() { container.remove(); }, 4000);
}

var KEY = "identity-defense-bench-v2";
var state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { state = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }
function val(p) { return state[p] || ""; }
function set(p, v) { state[p] = v; save(); updateNav(); }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

var current = 0;
var STATIONS = [
  { id: "map",       icon: "01", title: "Account Map" },
  { id: "passwords", icon: "02", title: "Password Health" },

  { id: "pretexts",  icon: "07", title: "Scam Defense" },

function field(path, opts) {
  var v = esc(val(path));
  var h = '<div class="field"><label class="field-label">' + opts.label;
  if (opts.hint) h += ' <span class="field-hint">' + opts.hint + '</span>';
  h += '</label>';
  if (opts.multi) h += '<textarea data-path="' + path + '" rows="' + (opts.rows||3) + '" placeholder="' + esc(opts.placeholder||"") + '">' + v + '</textarea>';
  else h += '<input type="text" data-path="' + path + '" value="' + v + '" placeholder="' + esc(opts.placeholder||"") + '">';
  h += '</div>';
  return h;
}

function checkbox(path, label) {
  return '<li><label><input type="checkbox" data-check="' + path + '"' + (val(path)==="1" ? " checked" : "") + '> ' + label + '</label></li>';
}

function radioGroup(path, options) {
  var cur = val(path), h = '<div class="radio-group">';
  for (var i = 0; i < options.length; i++)
    h += '<label><input type="radio" name="' + path + '" value="' + options[i].value + '"' + (cur===options[i].value ? ' checked' : '') + '><span>' + options[i].label + '</span></label>';
  return h + '</div>';
}

function stationComplete(id) {
  if (id === "map") { var c = 0; ACCOUNT_CATEGORIES.forEach(function(cat){ cat.accounts.forEach(function(a){ if(val("acct_"+cat.id+"_"+a.name)==="1") c++; }); }); return c >= 5; }
  if (id === "passwords") { return !!val("pw_breached_count") && !!val("pw_changed_count"); }
  if (id === "recovery") { return !!val("rec1_account") && !!val("rec1_weakest"); }
  if (id === "rebuild") { return val("rebuild_sms")==="1" && val("rebuild_codes")==="1" && val("rebuild_second")==="1"; }
  if (id === "cleanup") { return val("freeze_equifax")==="1" && val("freeze_experian")==="1" && val("freeze_transunion")==="1"; }
  if (id === "pretexts") { var done = 0; MESSAGES.forEach(function(m){ if(val("msg"+m.id+"_verdict")) done++; }); return done >= 8; }
  return false;
}

function renderNav() {
  var h = "";
  for (var i = 0; i < STATIONS.length; i++) {
    var s = STATIONS[i], cls = "navitem";
    if (i === current) cls += " active";
    if (stationComplete(s.id)) cls += " done";
    h += '<button class="' + cls + '" data-i="' + i + '"><span class="ico">' + s.icon + '</span><span>' + s.title + '</span><span class="tick">✓</span></button>';
  }
  document.getElementById("nav").innerHTML = h;
}
function updateNav() { renderNav(); }

function getCustomAccounts(catId) {
  try { return JSON.parse(val("custom_" + catId) || "[]"); } catch(e) { return []; }
}
function addCustomAccount(catId) {
  var input = document.getElementById("add_" + catId);
  if (!input || !input.value.trim()) return;
  var list = getCustomAccounts(catId);
  list.push(input.value.trim());
  set("custom_" + catId, JSON.stringify(list));
  render();
}
function removeCustomAccount(catId, idx) {
  var list = getCustomAccounts(catId);
  list.splice(idx, 1);
  set("custom_" + catId, JSON.stringify(list));
  render();
}

function renderBorder() {
  var h = '<div class="station"><div class="eyebrow">Station 6</div><h2 class="stn-title">Border Crossing</h2>'
    + '<p class="stn-lede">If your phone is searched at a border, everything on it is visible — your real accounts, your contacts, your messages. The defense is a <b>clean travel identity</b>: fresh accounts on the device, real ones recoverable from a separate email, and no trail connecting the two.</p>'
    + '<div class="alert"><b>This is legal.</b> You are not obligated to carry your personal data across a border. Having a clean phone with minimal accounts is not deception — it is the same security practice journalists, lawyers, and activists use worldwide.</div>'
    + '<div class="card accent"><h3>Step 1: Create a clean recovery email</h3>'
    + '<div class="hint">This email exists only to receive password resets for your real accounts while traveling. It is not connected to your name, your phone number, or your daily email.</div>'
    + '<ul class="checklist">'
    + checkbox("border_recovery_email", "Created a new email on a different provider (e.g. ProtonMail, Tutanota) — not linked to my real name or phone")
    + checkbox("border_recovery_2fa", "2FA enabled on the recovery email with a memorized password — no authenticator app needed")
    + checkbox("border_recovery_no_contacts", "No contacts imported, no profile photo, no signature")
    + '</ul>'
    + field("border_recovery_addr", { label: "Clean recovery email address", hint: "write it down separately, do not save it on your phone", placeholder: "e.g. the address you created" })
    + '</div>'
    + '<div class="card blue"><h3>Step 2: Create clean social accounts</h3>'
    + '<div class="hint">Fresh accounts with minimal content. These are what appear on your phone if it is inspected. Your real accounts are logged out and recoverable through the clean email.</div>'
    + '<ul class="checklist">'
    + checkbox("border_fb", "Created a clean Facebook account — minimal friends, no posts, generic profile")
    + checkbox("border_ig", "Created a clean Instagram account — empty or a few innocuous posts")
    + checkbox("border_x", "Created a clean X / Twitter account (if needed)")
    + checkbox("border_messaging", "Clean messaging app installed (Signal or WhatsApp with the clean number or email)")
    + '</ul>'
    + '<div class="hint" style="margin-top:8px"><b>Key:</b> These accounts use the clean recovery email, not your real one. A border search sees a phone with social accounts that look normal but contain nothing sensitive.</div>'
    + '</div>'
    + '<div class="card red"><h3>Step 3: Prepare your real accounts for recovery</h3>'
    + '<div class="hint">Before you travel, add the clean recovery email as a backup recovery method on your real accounts. Then log out of everything real on the travel device.</div>'
    + '<ul class="checklist">'
    + checkbox("border_real_recovery", "Added clean recovery email as backup on my real Gmail / Outlook / iCloud")
    + checkbox("border_logged_out", "Logged out of ALL real accounts on the travel device")
    + checkbox("border_apps_removed", "Removed real account apps or switched to clean accounts in them")
    + checkbox("border_browser_clean", "Browser history cleared, no saved passwords for real accounts on this device")
    + '</ul>'
    + '</div>'
    + '<div class="card green"><h3>Step 4: Clean the trail</h3>'
    + '<div class="hint">The connection between your clean identity and your real identity must not be visible on the device. These are the traces people miss.</div>'
    + '<ul class="checklist">'
    + checkbox("border_no_reset_emails", "Deleted all password-reset and verification emails from the clean email inbox — these reveal which real accounts it can recover")
    + checkbox("border_no_2fa_sms", "No SMS verification codes in the message history that tie to real accounts")
    + checkbox("border_no_screenshots", "No screenshots of recovery codes, QR codes, or account settings in the photo library")
    + checkbox("border_no_notes", "No notes app entries with passwords, recovery codes, or account lists")
    + checkbox("border_no_pw_manager", "Password manager on the travel device either removed or contains only clean account entries")
    + checkbox("border_no_email_trail", "Clean email sent/trash/spam folders emptied — not just inbox")
    + '</ul>'
    + '</div>'
    + '<div class="card accent"><h3>Step 5: Recovery plan</h3>'
    + '<div class="hint">Once you are through the border, you need to get back into your real accounts. Write down the plan before you travel.</div>'
    + field("border_plan", { label: "My recovery plan", multi: true, rows: 4, placeholder: "1. Connect to WiFi at destination\n2. Log into clean recovery email\n3. Reset password on real Gmail from clean email\n4. Re-download real apps and log in\n5. Remove clean recovery email as backup (optional)" })
    + field("border_codes_location", { label: "Where are my real recovery codes while traveling?", hint: "not on the device", placeholder: "e.g. printed sheet in checked luggage, or memorized, or with a trusted contact at home" })
    + '</div>'
    + '</div>';
  return h;
}

var quizRound = 0;
var QUIZ_SIZE = 6;

function seededShuffle(arr, seed) {
  var a = arr.slice(), s = seed;
  for (var i = a.length - 1; i > 0; i--) {
    s = (s * 16807 + 0) % 2147483647;
    var j = s % (i + 1);
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function getQuizMessages() {
  if (!MESSAGE_BANK.length) return [];
  var shuffled = seededShuffle(MESSAGE_BANK, quizRound + 1);
  return shuffled.slice(0, QUIZ_SIZE);
}

function renderPretexts() {

    + '<li><label style="font-size:14px"><b>2. Hover the link before you click.</b> On desktop, hover over any link and read the URL in the bottom-left of your browser. On mobile, long-press. If the domain does not match the sender, do not click.</label></li>'

    + '<li><label style="font-size:14px"><b>4. Check the company\'s verification page.</b> Each curated message below has a "Verify ↗" link to the company\'s official guide for real vs fake messages.</label></li>'
    + '</ul></div>'

    }
    if (revealed) {

      h += '</div>';
    }
    h += '</div>';
  }

  if (showingQuiz && totalAnswered === messagesToShow.length && totalAnswered > 0) {

    { slug: "cap.falsify-your-own-account-recovery-by-attempting-it",
      title: "Falsify your own account recovery by attempting it",
      req: "A written attempt log, the furthest step reached, and the control you added",
      met: function() { return !!val("rec1_account") && !!val("rec1_chain") && !!val("rec1_weakest") && !!val("rec1_fix"); } },
    { slug: "cap.configure-recovery-that-survives-losing-the-device",
      title: "Configure recovery that survives losing the device",
      req: "Recovery codes printed off-device, SMS removed, second recovery path",
      met: function() { return val("rebuild_sms")==="1" && val("rebuild_codes")==="1" && val("rebuild_second")==="1"; } },
    { slug: "cap.verify-what-can-be-found-about-you-is-actually-gone",
      title: "Verify what can be found about you is actually gone",
      req: "Brokers contacted, before-and-after search, items that did not come down",
      met: function() { var f=0; ["equifax","experian","transunion"].forEach(function(b){ if(val("freeze_"+b)==="1") f++; }); var br=0; ["spokeo","whitepages","beenverified","intelius","truepeoplesearch","fastpeoplesearch"].forEach(function(b){ if(val("broker_"+b)==="1") br++; }); return f>=3 || br>=3; } },
    { slug: "cap.operate-a-callback-rule-against-incoming-contact",
      title: "Operate a callback rule against incoming contact",
      req: "One real incoming contact you verified by calling back",
      met: function() { return correct >= 3 && val("pw_has_manager")==="1"; } }
  ];

  h += '<div class="card accent" style="margin-top:28px"><h3>Submit for credit</h3>'
     + '<div class="hint" style="margin-bottom:14px">This submits <b>only yes/no per standard</b> — not your passwords, account names, or any field contents. It records which capabilities you demonstrated tonight.</div>'
    + '<div class="hint" style="margin-bottom:14px;padding:8px 12px;background:var(--panel2);border-radius:var(--r)"><b>Extra credit:</b> Open your browser dev tools (F12 or Cmd+Opt+I), go to the <b>Network</b> tab, then click Submit. Verify for yourself that the only data leaving your browser is the list of standard slugs you met — no passwords, no account names, nothing else. <i>This is how you verify any tool that claims to be private.</i></div>';

  var anyMet = false;
  for (var si = 0; si < standards.length; si++) {
    var st = standards[si], isMet = st.met();
    if (isMet) anyMet = true;
    h += '<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px">'
       + '<span style="font-size:18px;flex:0 0 auto;margin-top:-1px">' + (isMet ? '<span style="color:var(--green)">✓</span>' : '<span style="color:var(--dim)">○</span>') + '</span>'
       + '<div><b>' + st.title + '</b><br><span style="color:var(--mut);font-size:12px">' + st.req + '</span></div></div>';
  }

  var submitted = val("credit_submitted");
  if (submitted) {
    h += '<div style="margin-top:14px;padding:10px 14px;background:var(--green-bg);border:1px solid var(--green);border-radius:var(--r);font-size:13px;color:var(--green)">✓ Submitted ' + esc(submitted) + '</div>';
  } else if (anyMet) {
    h += '<button id="submit-credit" type="button" style="margin-top:14px;width:100%;padding:12px;font-family:var(--mono);font-size:14px;letter-spacing:.04em;background:var(--amber-bg);border:1px solid var(--amber);color:var(--amber-ink);border-radius:var(--r);cursor:pointer">Submit for credit</button>';
  } else {
    h += '<div style="margin-top:10px;color:var(--dim);font-size:13px">Complete at least one standard above to submit.</div>';
  }
  h += '</div>';

  h += '</div>';
  return h;
}

var RENDERERS = [renderMap, renderPasswords, renderRecovery, renderRebuild, renderCleanup, renderBorder, renderPretexts, renderAudit];

function render() {
  var el = document.getElementById("station");
  el.innerHTML = RENDERERS[current]();
  bindFields(el);
  renderNav();
}

function bindFields(root) {
  var inputs = root.querySelectorAll("[data-path]");
  for (var i = 0; i < inputs.length; i++) {
    inputs[i].addEventListener("input", (function(inp) { return function() { set(inp.getAttribute("data-path"), inp.value); }; })(inputs[i]));
  }
  var radios = root.querySelectorAll('input[type="radio"]');
  for (var i = 0; i < radios.length; i++) {
    radios[i].addEventListener("change", (function(r) { return function() { if(r.checked) { set(r.name, r.value); if(current===6) render(); } }; })(radios[i]));
  }
  var checks = root.querySelectorAll("[data-check]");
  for (var i = 0; i < checks.length; i++) {
    checks[i].addEventListener("change", (function(c) { return function() { set(c.getAttribute("data-check"), c.checked ? "1" : ""); if(current<=5) render(); }; })(checks[i]));
  }
  var addBtns = root.querySelectorAll("[data-add-cat]");
  for (var i = 0; i < addBtns.length; i++) {
    addBtns[i].addEventListener("click", (function(btn) { return function() { addCustomAccount(btn.getAttribute("data-add-cat")); }; })(addBtns[i]));
  }
  var rmBtns = root.querySelectorAll("[data-remove-cat]");
  for (var i = 0; i < rmBtns.length; i++) {
    rmBtns[i].addEventListener("click", (function(btn) { return function() { removeCustomAccount(btn.getAttribute("data-remove-cat"), parseInt(btn.getAttribute("data-remove-idx"))); }; })(rmBtns[i]));
  }
  var quizBtns = root.querySelectorAll("[data-quiz-mode]");
  for (var i = 0; i < quizBtns.length; i++) {
    quizBtns[i].addEventListener("click", (function(btn) { return function() {
      var mode = btn.getAttribute("data-quiz-mode");
      set("scam_mode", mode === "quiz" ? "quiz" : "");
      render();
    }; })(quizBtns[i]));
  }
  var nextBtn = root.querySelector("[data-next-round]");
  if (nextBtn) {
    nextBtn.addEventListener("click", function() {
      quizRound++;
      render();
      document.getElementById("station").scrollIntoView({block:"start",behavior:"smooth"});
    });
  }
  // Streak + confetti on reveal
  var reveals2 = root.querySelectorAll("[data-reveal]");
  for (var i = 0; i < reveals2.length; i++) {
    reveals2[i].addEventListener("click", (function(btn) { return function() {
      var pfx = btn.getAttribute("data-reveal-prefix") || "";
      var mid = btn.getAttribute("data-reveal");
      set(pfx + "msg" + mid + "_revealed", "1");
      // Update streak
      var msgAnswer = null;
      var allMsgs = (val("scam_mode") === "quiz") ? getQuizMessages() : MESSAGES;
      for (var j = 0; j < allMsgs.length; j++) { if (String(allMsgs[j].id) === mid) { msgAnswer = allMsgs[j].answer; break; } }
      if (msgAnswer && val(pfx + "msg" + mid + "_verdict") === msgAnswer) {
        var s = parseInt(val("quiz_streak") || "0", 10) + 1;
        set("quiz_streak", String(s));
        var best = parseInt(val("quiz_best_streak") || "0", 10);
        if (s > best) set("quiz_best_streak", String(s));
        if (s > 0 && s % 5 === 0) confetti();
      } else {
        set("quiz_streak", "0");
      }
      render();
    }; })(reveals2[i]));
  }
  var submitBtn = root.querySelector("#submit-credit");
  if (submitBtn) {
    submitBtn.addEventListener("click", function() {
      var standards = [
        { slug: "cap.classify-an-incoming-contact-as-genuine-or-pretext", met: false },
        { slug: "cap.falsify-your-own-account-recovery-by-attempting-it", met: false },
        { slug: "cap.configure-recovery-that-survives-losing-the-device", met: false },
        { slug: "cap.verify-what-can-be-found-about-you-is-actually-gone", met: false },
        { slug: "cap.operate-a-callback-rule-against-incoming-contact", met: false }
      ];
      var c=0; MESSAGES.forEach(function(m){ if(val("msg"+m.id+"_verdict")===m.answer) c++; });
      standards[0].met = c >= 10;
      standards[1].met = !!val("rec1_account") && !!val("rec1_chain") && !!val("rec1_weakest") && !!val("rec1_fix");
      standards[2].met = val("rebuild_sms")==="1" && val("rebuild_codes")==="1" && val("rebuild_second")==="1";
      var fr=0; ["equifax","experian","transunion"].forEach(function(b){ if(val("freeze_"+b)==="1") fr++; });
      var br=0; ["spokeo","whitepages","beenverified","intelius","truepeoplesearch","fastpeoplesearch"].forEach(function(b){ if(val("broker_"+b)==="1") br++; });
      standards[3].met = fr>=3 || br>=3;
      standards[4].met = c >= 3 && val("pw_has_manager")==="1";
      var payload = { tool: "identity-defense-bench", standards: standards.filter(function(s){ return s.met; }).map(function(s){ return s.slug; }) };
      fetch("/api/tool-credit", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload), credentials: "same-origin" })
        .then(function(r) { if(r.ok) { set("credit_submitted", new Date().toLocaleDateString()); render(); } else { alert("Could not submit — are you logged in?"); } })
        .catch(function() { set("credit_submitted", new Date().toLocaleDateString() + " (offline)"); render(); });
    });
  }
}

document.getElementById("nav").addEventListener("click", function(e) {
  var btn = e.target.closest(".navitem");
  if (!btn) return;
  current = parseInt(btn.getAttribute("data-i"), 10);
  render();
  document.getElementById("station").scrollIntoView({ block: "start", behavior: "smooth" });
});
document.getElementById("clear-all").addEventListener("click", function() {
  if (confirm("Clear all your work? This cannot be undone.")) { state = {}; save(); current = 0; render(); }
});
document.getElementById("print-btn").addEventListener("click", function() {
  current = 7; render(); setTimeout(function() { window.print(); }, 200);
});

render();
})();
</script>
