name: iphone_spyware_check
display_name: "iPhone / iPad Spyware Check"
description: >
  Scans a local iPhone or iPad backup for known mercenary-spyware indicators
  (Pegasus, Predator, and similar) using Amnesty International's Mobile
  Verification Toolkit (MVT). This is the one profile that actually RUNS the
  backup scan — every other scan only reports that a scan is available, because
  scanning a backup is slow. Backups of any size are scanned; an encrypted
  backup is reported with the command to unlock it first, and a scan that
  doesn't finish is reported as unfinished, never as clean.
  See docs/CHECK_IPHONE_FOR_SPYWARE.md.
modules:
  include:
    - mvt_spyware_scan
  exclude: []
module_config:
  mvt_spyware_scan:
    # Turn the backup scan ON for this profile (off everywhere else).
    scan_backups: true
    # Only iPhone/iPad backups; android_spyware_check does Android.
    look_for: ios
    # No size limit (0). To skip backups above a size on a machine short on
    # memory, set max_backup_bytes to a number of bytes (2 GB = 2147483648).
    max_backup_bytes: 0
