name: ai_worm_response
display_name: "AI Worm & Spyware Response"
description: >
  Comprehensive scan for AI-led worm compromise (Shai Halud, Miasma,
  SANDWORM_MODE, SesameOp) and mobile spyware. Checks filesystem
  artifacts, git/SSH integrity, persistence mechanisms, network C2,
  lateral movement indicators, and mobile device backups.
modules:
  include:
    - ai_worm_filesystem
    - ai_worm_git_ssh
    - ai_worm_persistence
    - ai_worm_network
    - ai_worm_lateral
    - launch_agent_audit
    - launchd_persistence_audit
    - scheduled_tasks_audit
    - mvt_spyware_scan
    - ai_agent_audit
    - vulnerable_runtimes
    - endor_dependency_scan
  exclude: []
module_config:
  ai_worm_filesystem:
    sensitivity: elevated
  ai_worm_git_ssh:
    sensitivity: elevated
  ai_worm_persistence:
    sensitivity: elevated
  ai_worm_network:
    sensitivity: elevated
  ai_worm_lateral:
    sensitivity: elevated
  endor_dependency_scan:
    # Off here: a scan sends package details to Endor Labs, so the person
    # asks for it with the dependency_scan profile. Here it only says
    # whether it's available and what it would send.
    scan_projects: false
